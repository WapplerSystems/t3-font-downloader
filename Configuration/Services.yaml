services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  WapplerSystems\FontDownloader\:
    resource: '../Classes/*'

  WapplerSystems\FontDownloader\Hooks\RenderPreProcessorHook:
    public: true

  WapplerSystems\FontDownloader\FontLoader\FontLoaderRegistry:
    public: true
    arguments:
      - !tagged_iterator fontloader